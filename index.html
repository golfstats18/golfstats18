function ls(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function lsr(k){try{localStorage.removeItem(k);}catch{}}
function pct(n,d){if(!d)return "0%";return Math.round((n/d)*100)+"%";}
function grnArr(v){return Array.isArray(v)?v:(v?[v]:[]);}

function scoreToPar(diff,isNR){
  if(isNR)return {label:"NR",color:"#94a3b8"};
  if(diff==null)return null;
  if(diff<=-2)return {label:"Eagle",color:"#facc15"};
  if(diff===-1)return {label:"Birdie",color:"#4ade80"};
  if(diff===0)return {label:"Par",color:"#86efac"};
  if(diff===1)return {label:"Bogey",color:"#f97316"};
  if(diff===2)return {label:"Double",color:"#ef4444"};
  return {label:"+"+diff,color:"#dc2626"};
}

function sdDisplay(diff){
  if(diff==null)return {text:"—",color:"#ffffff"};
  const n=Number(diff);
  if(n===0)return {text:"E",color:"#4ade80"};
  if(n>0)return {text:"+"+n,color:"#ef4444"};
  return {text:""+n,color:"#4ade80"};
}

function stablefordPts(shots,par,si,hcp){
  if(!shots||!par||!hcp)return null;
  const extra=(hcp>=si?1:0)+(hcp>=si+18?1:0);
  const diff=(shots-extra)-par;
  if(diff>=2)return 0;
  if(diff===1)return 1;
  if(diff===0)return 2;
  if(diff===-1)return 3;
  if(diff===-2)return 4;
  return 5;
}

function calcStats(fwy,fwy2,grn,putts,scores,nr,ob,hazard,updown,pars,hcp,si){
  const fwyHit=Object.values(fwy).filter(v=>v==="Hit").length;
  const fwyL=Object.values(fwy).filter(v=>v==="L").length;
  const fwyR=Object.values(fwy).filter(v=>v==="R").length;
  const fwyTotal=Object.entries(fwy).filter(([h])=>pars[h]!==3).length;
  const fwy2Hit=Object.values(fwy2).filter(v=>v==="Hit").length;
  const fwy2L=Object.values(fwy2).filter(v=>v==="L").length;
  const fwy2R=Object.values(fwy2).filter(v=>v==="R").length;
  const fwy2Total=Object.keys(fwy2).length;
  const grnVals=Object.values(grn).map(grnArr).filter(v=>v.length>0);
  const grnHit=grnVals.filter(v=>v.includes("Hit")).length;
  const grnL=grnVals.filter(v=>v.includes("L")).length;
  const grnR=grnVals.filter(v=>v.includes("R")).length;
  const grnS=grnVals.filter(v=>v.includes("S")).length;
  const grnLong=grnVals.filter(v=>v.includes("L+")).length;
  const grnTotal=grnVals.length;
  const puttArr=Object.values(putts).map(Number).filter(n=>!isNaN(n)&&n>0);
  const totalPutts=puttArr.reduce((a,b)=>a+b,0);
  const avgPutts=puttArr.length?(totalPutts/puttArr.length).toFixed(1):"—";
  const threePuttHoles=puttArr.filter(n=>n>=3).length;
  const grnLayup=Object.values(grn).map(grnArr).filter(v=>v.includes("LU")).length;
  let totalScore=0,totalPar=0,holesScored=0,totalStableford=0;
  const holeDiffs={},holeSF={};
  HOLES.forEach(h=>{
    if(nr&&nr[h]){
      const extra=(hcp>=si[h]?1:0)+(hcp>=si[h]+18?1:0);
      const nrScore=pars[h]+2+extra;
      totalScore+=nrScore;totalPar+=pars[h];holesScored++;
      holeDiffs[h]=nrScore-pars[h];holeSF[h]=0;
    } else if(scores[h]&&pars[h]){
      totalScore+=Number(scores[h]);totalPar+=pars[h];holesScored++;
      holeDiffs[h]=Number(scores[h])-pars[h];
      if(hcp){const p=stablefordPts(Number(scores[h]),pars[h],si[h],hcp);holeSF[h]=p;if(p!=null)totalStableford+=p;}
    }
  });
  const totalOB=Object.values(ob||{}).filter(Boolean).length;
  const totalHazard=Object.values(hazard||{}).filter(Boolean).length;
  const udChances=Object.keys(updown||{}).length;
  const udGot=Object.values(updown||{}).filter(v=>v==="yes").length;
  return {
    fwyHit,fwyL,fwyR,fwyTotal,fwy2Hit,fwy2L,fwy2R,fwy2Total,
    grnHit,grnL,grnR,grnS,grnLong,grnTotal,
    totalPutts,avgPutts,threePuttHoles,grnLayup,
    holesPlayed:Math.max(fwyTotal,grnTotal,puttArr.length,holesScored),
    totalScore,totalPar,scoreDiff:holesScored>0?totalScore-totalPar:null,
    holesScored,holeDiffs,holeSF,totalStableford,
    totalOB,totalHazard,udChances,udGot,
    eagles:Object.values(holeDiffs).filter(d=>d<=-2).length,
    birdies:Object.values(holeDiffs).filter(d=>d===-1).length,
    parsCount:Object.values(holeDiffs).filter(d=>d===0).length,
    bogeys:Object.values(holeDiffs).filter(d=>d===1).length,
    doubles:Object.values(holeDiffs).filter(d=>d===2).length,
    worse:Object.values(holeDiffs).filter(d=>d>=3).length,
    coursePar:HOLES.reduce((a,h)=>a+pars[h],0),
  };
}

function aggregateRounds(rounds){
  if(!rounds.length)return null;
  let fwyHit=0,fwyL=0,fwyR=0,fwyTotal=0,grnHit=0,grnL=0,grnR=0,grnS=0,grnLong=0,grnTotal=0;
  let totalPutts=0,puttHoles=0,eagles=0,birdies=0,parsCount=0,bogeys=0,doubles=0,worse=0;
  let totalScoreDiff=0,scoredRounds=0,totalOB=0,totalHazard=0,udChances=0,udGot=0;
  rounds.forEach(r=>{
    const s=r.stats;
    fwyHit+=s.fwyHit;fwyL+=s.fwyL;fwyR+=s.fwyR;fwyTotal+=s.fwyTotal;
    grnHit+=s.grnHit;grnL+=s.grnL;grnR+=s.grnR;grnS+=s.grnS;grnLong+=s.grnLong;grnTotal+=s.grnTotal;
    totalPutts+=s.totalPutts;puttHoles+=s.grnTotal;
    eagles+=s.eagles;birdies+=s.birdies;parsCount+=s.parsCount;bogeys+=s.bogeys;doubles+=s.doubles;worse+=s.worse;
    if(s.scoreDiff!=null){totalScoreDiff+=s.scoreDiff;scoredRounds++;}
    totalOB+=(s.totalOB||0);totalHazard+=(s.totalHazard||0);
    udChances+=(s.udChances||0);udGot+=(s.udGot||0);
  });
  return {
    fwyHit,fwyL,fwyR,fwyTotal,grnHit,grnL,grnR,grnS,grnLong,grnTotal,
    totalPutts,avgPutts:puttHoles?(totalPutts/puttHoles).toFixed(1):"—",
    eagles,birdies,parsCount,bogeys,doubles,worse,
    avgScoreDiff:scoredRounds?(totalScoreDiff/scoredRounds).toFixed(1):null,
    totalOB,totalHazard,udChances,udGot,rounds:rounds.length,
  };
}

function App(){
  const [session,setSession]=useState(null);
  const [authChecked,setAuthChecked]=useState(false);
  const [trialDaysLeft,setTrialDaysLeft]=useState(null);
  const [isSubscribed,setIsSubscribed]=useState(false);
  const [fwy,setFwy]=useState(()=>ls("gs18_fwy",{}));
  const [fwy2,setFwy2]=useState(()=>ls("gs18_fwy2",{}));
  const [grn,setGrn]=useState(()=>ls("gs18_grn",{}));
  const [putts,setPutts]=useState(()=>ls("gs18_putts",{}));
  const [scores,setScores]=useState(()=>ls("gs18_scores",{}));
  const [nr,setNr]=useState(()=>ls("gs18_nr",{}));
  const [ob,setOb]=useState(()=>ls("gs18_ob",{}));
  const [hazard,setHazard]=useState(()=>ls("gs18_hazard",{}));
  const [notes,setNotes]=useState(()=>ls("gs18_notes",{}));
  const [updown,setUpdown]=useState(()=>ls("gs18_updown",{}));
  const [pars,setPars]=useState(()=>ls("gs18_pars",DEFAULT_PARS));
  const [si,setSi]=useState(()=>ls("gs18_si",DEFAULT_SI));
  const [courseName,setCourseName]=useState(()=>ls("gs18_courseName",""));
  const [handicap,setHandicap]=useState(()=>ls("gs18_handicap",""));
  const [activeTab,setActiveTab]=useState("input");
  const [savedRounds,setSavedRounds]=useState([]);
  const [viewRound,setViewRound]=useState(null);
  const [saveMsg,setSaveMsg]=useState("");
  const [confirmDelete,setConfirmDelete]=useState(null);
  const [loadingRounds,setLoadingRounds]=useState(false);
  const [savedCourses,setSavedCourses]=useState(()=>ls("gs18_courses",[]));
  const [showSaveCourse,setShowSaveCourse]=useState(false);
  const [newCourseName,setNewCourseName]=useState("");
  const [showCourseList,setShowCourseList]=useState(false);
  const [editingRoundId,setEditingRoundId]=useState(null);

  const checkTrial=(s)=>{
    if(!s?.user)return;
    const meta=s.user.user_metadata||{};
    // Check subscription flag
    if(meta.subscribed===true){setIsSubscribed(true);setTrialDaysLeft(999);return;}
    // Check trial
    const trialStart=meta.trial_start;
    if(!trialStart){
      // Existing user with no trial_start — give them full access, set trial_start now
      sb.auth.updateUser({data:{trial_start:new Date().toISOString()}});
      setTrialDaysLeft(TRIAL_DAYS);
      return;
    }
    const elapsed=Math.floor((Date.now()-new Date(trialStart).getTime())/(1000*60*60*24));
    setTrialDaysLeft(Math.max(0,TRIAL_DAYS-elapsed));
  };

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setSession(session);checkTrial(session);setAuthChecked(true);});
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>{setSession(s);checkTrial(s);setAuthChecked(true);});
    return ()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{if(!session)return;setLoadingRounds(true);sb.from("rounds").select("*").order("created_at",{ascending:false}).then(({data,error})=>{if(!error&&data)setSavedRounds(data);setLoadingRounds(false);});},[session]);

  useEffect(()=>{lss("gs18_fwy",fwy);},[fwy]);
  useEffect(()=>{lss("gs18_fwy2",fwy2);},[fwy2]);
  useEffect(()=>{lss("gs18_grn",grn);},[grn]);
  useEffect(()=>{lss("gs18_putts",putts);},[putts]);
  useEffect(()=>{lss("gs18_scores",scores);},[scores]);
  useEffect(()=>{lss("gs18_nr",nr);},[nr]);
  useEffect(()=>{lss("gs18_ob",ob);},[ob]);
  useEffect(()=>{lss("gs18_hazard",hazard);},[hazard]);
  useEffect(()=>{lss("gs18_notes",notes);},[notes]);
  useEffect(()=>{lss("gs18_updown",updown);},[updown]);
  useEffect(()=>{lss("gs18_pars",pars);},[pars]);
  useEffect(()=>{lss("gs18_si",si);},[si]);
  useEffect(()=>{lss("gs18_courseName",courseName);},[courseName]);
  useEffect(()=>{lss("gs18_handicap",handicap);},[handicap]);

  const hcp=parseInt(handicap)||0;
  const stats=useMemo(()=>calcStats(fwy,fwy2,grn,putts,scores,nr,ob,hazard,updown,pars,hcp,si),[fwy,fwy2,grn,putts,scores,nr,ob,hazard,updown,pars,hcp,si]);
  const aggregate=useMemo(()=>aggregateRounds(savedRounds),[savedRounds]);
  const sd=sdDisplay(stats.scoreDiff);

  const handleFwy=(h,v)=>setFwy(p=>({...p,[h]:p[h]===v?undefined:v}));
  const handleFwy2=(h,v)=>setFwy2(p=>({...p,[h]:p[h]===v?undefined:v}));
  const handleGrn=(h,v)=>{
    if(v==="Hit"){setGrn(p=>({...p,[h]:["Hit"]}));}
    else{setGrn(p=>{const cur=grnArr(p[h]).filter(x=>x!=="Hit");const next=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];return {...p,[h]:next.length?next:undefined};});}
  };
  const handlePutts=(h,v)=>setPutts(p=>({...p,[h]:p[h]===v?undefined:v}));
  const handleScore=(h,d)=>setScores(p=>{const c=p[h]??pars[h];return {...p,[h]:Math.max(1,c+d)};});
  const handlePar=(h,v)=>setPars(p=>({...p,[h]:v}));
  const handleSI=(h,d)=>setSi(p=>({...p,[h]:Math.min(18,Math.max(1,(p[h]||1)+d))}));
  const handleNR=(h)=>{setNr(p=>({...p,[h]:p[h]?undefined:true}));setScores(p=>({...p,[h]:undefined}));};

  const clearRound=()=>{
    setFwy({});setFwy2({});setGrn({});setPutts({});setScores({});setNr({});setOb({});setHazard({});setNotes({});setUpdown({});setCourseName("");setHandicap("");
    ["gs18_fwy","gs18_fwy2","gs18_grn","gs18_putts","gs18_scores","gs18_nr","gs18_ob","gs18_hazard","gs18_updown","gs18_courseName","gs18_handicap"].forEach(lsr);
  };

  const doSave=async()=>{
    if(stats.holesScored===0&&stats.fwyTotal===0){setSaveMsg("Nothing to save yet!");setTimeout(()=>setSaveMsg(""),3000);return;}
    const roundData={user_id:session.user.id,course:courseName||"Unnamed Course",stats,data:{fwy,fwy2,grn,putts,scores,nr,ob,hazard,notes,updown,pars,handicap,si}};
    if(editingRoundId){
      const {data,error}=await sb.from("rounds").update(roundData).eq("id",editingRoundId).select().single();
      if(error){setSaveMsg("Error updating - try again.");setTimeout(()=>setSaveMsg(""),3000);return;}
      setSavedRounds(p=>p.map(r=>r.id===editingRoundId?data:r));
      setSaveMsg("Round updated!");
      setEditingRoundId(null);
    } else {
      const round={...roundData,date:new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
      const {data,error}=await sb.from("rounds").insert(round).select().single();
      if(error){setSaveMsg("Error saving - try again.");setTimeout(()=>setSaveMsg(""),3000);return;}
      setSavedRounds(p=>[data,...p]);
      setSaveMsg("Round saved to My Stats!");
    }
    setTimeout(()=>setSaveMsg(""),3000);
    clearRound();
  };

  const doEditRound=(r)=>{
    const d=r.data||{};
    setFwy(d.fwy||{});setFwy2(d.fwy2||{});setGrn(d.grn||{});setPutts(d.putts||{});
    setScores(d.scores||{});setNr(d.nr||{});setOb(d.ob||{});setHazard(d.hazard||{});setNotes(d.notes||{});
    setUpdown(d.updown||{});setPars(d.pars||DEFAULT_PARS);setSi(d.si||DEFAULT_SI);
    setCourseName(r.course||"");setHandicap(d.handicap||"");
    setEditingRoundId(r.id);
    setViewRound(null);
    setActiveTab("input");
  };

  const doDelete=async(id)=>{await sb.from("rounds").delete().eq("id",id);setSavedRounds(p=>p.filter(r=>r.id!==id));setConfirmDelete(null);setViewRound(null);};
  const doSignOut=async()=>{await sb.auth.signOut();setSession(null);setSavedRounds([]);};
  const doSaveCourse=()=>{const name=newCourseName.trim();if(!name)return;const updated=[...savedCourses.filter(c=>c.name!==name),{name,pars:{...pars},si:{...si}}];setSavedCourses(updated);lss("gs18_courses",updated);setNewCourseName("");setShowSaveCourse(false);alert("Saved: "+name);};
  const doLoadCourse=(c)=>{setPars(c.pars);setSi(c.si);setCourseName(c.name);setShowCourseList(false);};

  const shareRound=(r)=>{
    const s=r.stats;
    const puttLine="Putts: "+s.totalPutts+" (avg "+s.avgPutts+")"+(s.threePuttHoles>0?" | 3-putts: "+s.threePuttHoles+" hole"+(s.threePuttHoles!==1?"s":""):"");
    const txt=["Golf Stats 18 - Round Summary","Course: "+r.course,"Date: "+r.date,"----------------","Score: "+(s.totalScore||"—")+(s.scoreDiff!=null?" ("+(s.scoreDiff>0?"+":"")+s.scoreDiff+")":""),s.totalStableford?"Stableford: "+s.totalStableford+" pts":"","----------------","Fairways: "+s.fwyHit+"/"+s.fwyTotal+" ("+pct(s.fwyHit,s.fwyTotal)+")","GIR: "+s.grnHit+"/"+s.grnTotal+" ("+pct(s.grnHit,s.grnTotal)+")"+(s.grnLayup>0?" | Lay-ups: "+s.grnLayup:""),puttLine,"Up & Down: "+(s.udChances>0?s.udGot+"/"+s.udChances+" ("+Math.round((s.udGot/s.udChances)*100)+"%)":"n/a"),"OOB: "+s.totalOB+" | Hazard: "+s.totalHazard,"----------------","Eagles: "+s.eagles+" Birdies: "+s.birdies+" Pars: "+s.parsCount,"Bogeys: "+s.bogeys+" Doubles: "+s.doubles+" Worse: "+s.worse,"----------------","Tracked with Golf Stats 18","golfstats18.netlify.app"].filter(Boolean).join("\n");
    if(navigator.share){navigator.share({title:"Golf Stats 18 - "+r.course,text:txt});}
    else{navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>alert("Copied!"));}
  };

  if(!authChecked)return <div style={{minHeight:"100vh",background:DARK,display:"flex",alignItems:"center",justifyContent:"center",color:WHITE,fontSize:12,letterSpacing:4}}>LOADING...</div>;

  if(trialDaysLeft!==null&&trialDaysLeft<=0&&!isSubscribed){
    return <PaywallScreen daysLeft={trialDaysLeft} onSignOut={()=>sb.auth.signOut()}/>;
  }
  if(trialDaysLeft!==null&&trialDaysLeft<=7&&!isSubscribed&&trialDaysLeft>0){
    // show a non-blocking banner — handled below
  }

  const TABS_ROW1=["setup","input","stats"];
  const TABS_ROW2=["history","coaching"];

  return (
    <div style={{minHeight:"100vh",background:BG,fontFamily:"Georgia,serif",color:WHITE}}>

            </div>

          {[TABS_ROW1,TABS_ROW2].map((row,ri)=>(

          <span onClick={()=>window.location.href="https://buy.stripe.com/eVq9AV8SW8rz8Pp0q64ow00"} style={{fontSize:13,color:YELLOW,fontWeight:"bold",cursor:"pointer",textDecoration:"underline"}}>Subscribe now £1.99/mo</span>
        </div>

        {activeTab==="coaching"&&<CoachingTab/>}

                <div style={{display:"flex",alignItems:"center",gap:4,marginLeft:6}}>

                  <div style={{width:28,textAlign:"center",fontSize:15,fontWeight:"bold",color:YELLOW}}>{si[hole]}</div>
                  <button onClick={()=>handleSI(hole,1)} style={{width:26,height:26,borderRadius:6,border:"1px solid #2d5a2d",background:"#0d1a0d",color:GREEN,cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>+</button>
                </div>
              </div>

            <div style={{marginTop:16,background:"#1a3a1a",border:"1px solid #2d5a2d",borderRadius:10,padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

              <span style={{fontSize:24,fontWeight:"bold",color:WHITE}}>{stats.coursePar}</span>
            </div>

                </div>

              </div>
            )}
            {!editingRoundId&&Object.keys(scores).length>0&&(
              <div style={{background:"#162816",border:"1px solid #2d5a2d",borderRadius:10,padding:"10px 16px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:13,color:WHITE,fontWeight:"bold"}}>Round in progress - {Object.keys(scores).length} holes</div>
                <div style={{fontSize:11,color:GREEN}}>Auto-saved</div>
              </div>
            )}
            <div style={{display:"flex",gap:10,marginBottom:16}}>
              <input value={courseName} onChange={e=>setCourseName(e.target.value)} placeholder="Course name" style={{...INP,flex:2}}/>

            </div>
            {hcp>0&&(
              <div style={{background:"#162816",border:"1px solid #2d5a2d",borderRadius:10,padding:"10px 16px",marginBottom:16,textAlign:"center",fontSize:13,color:WHITE}}>
                Playing handicap: {hcp} - Stableford active ⭐
              </div>
            )}
            {HOLES.map(hole=>{
              const diff=stats.holeDiffs[hole];
              const isNR=nr&&nr[hole];
              const sp=diff!==undefined?scoreToPar(diff,isNR):null;
              const sfPts=stats.holeSF[hole];
              const holeGrn=grnArr(grn[hole]);
              return (
                <div key={hole} style={{background:CARD,border:"1px solid "+(sp?sp.color+"66":"#2d5a2d"),borderRadius:12,marginBottom:12,overflow:"hidden"}}>
                  <div style={{background:"#1a3a1a",padding:"8px 16px",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid #2d5a2d"}}>
                    <div style={{width:32,height:32,borderRadius:"50%",background:sp?sp.color+"33":"#1f4f1f",border:"1px solid "+(sp?sp.color:"#2d5a2d"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:"bold",color:sp?sp.color:GREEN,flexShrink:0}}>{hole}</div>
                    <span style={{fontSize:11,color:WHITE,letterSpacing:1}}>Hole {hole} - Par {pars[hole]} - Index {si[hole]}</span>
                    <div style={{marginLeft:"auto",display:"flex",gap:5,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
                      {ob[hole]&&<span style={{fontSize:10,background:"#ef444422",color:"#ef4444",padding:"2px 5px",borderRadius:20,border:"1px solid #ef444444",fontWeight:"bold"}}>⛔OOB</span>}
                      {hazard[hole]&&<span style={{fontSize:10,background:"#f9731622",color:"#f97316",padding:"2px 5px",borderRadius:20,border:"1px solid #f9731644",fontWeight:"bold"}}>⚠️Haz</span>}
                      {notes[hole]&&<span style={{fontSize:10,background:"#60a5fa22",color:"#60a5fa",padding:"2px 5px",borderRadius:20,border:"1px solid #60a5fa44",fontWeight:"bold"}}>📝</span>}
                      {updown[hole]&&<span style={{fontSize:10,background:updown[hole]==="yes"?"#4ade8022":"#ef444422",color:updown[hole]==="yes"?"#4ade80":"#ef4444",padding:"2px 5px",borderRadius:20,border:"1px solid "+(updown[hole]==="yes"?"#4ade8044":"#ef444444"),fontWeight:"bold"}}>{updown[hole]==="yes"?"U&D✓":"U&D✗"}</span>}
                      {sfPts!=null&&hcp>0&&<span style={{fontSize:10,background:"#facc1522",color:YELLOW,padding:"2px 5px",borderRadius:20,border:"1px solid #facc1544",fontWeight:"bold"}}>⭐{sfPts}pts</span>}
                      {sp&&<span style={{fontSize:10,background:sp.color+"22",color:sp.color,padding:"2px 7px",borderRadius:20,border:"1px solid "+sp.color+"44",fontWeight:"bold"}}>{sp.label}</span>}

                    <div>
                      <div style={{fontSize:10,letterSpacing:3,color:WHITE,textTransform:"uppercase",marginBottom:8}}>Score</div>

                        <div style={{display:"flex",gap:4}}>
                          {[-1,0,1,2].map(d=>(
                            <button key={d} onClick={()=>{setScores(p=>({...p,[hole]:pars[hole]+d}));setNr(p=>({...p,[hole]:undefined}));}} style={{width:34,height:34,borderRadius:8,border:"1px solid "+(scores[hole]===pars[hole]+d&&!isNR?scoreToPar(d).color:"#2d5a2d"),background:scores[hole]===pars[hole]+d&&!isNR?scoreToPar(d).color+"22":"#0d1a0d",color:scores[hole]===pars[hole]+d&&!isNR?scoreToPar(d).color:WHITE,cursor:"pointer",fontSize:10,fontFamily:"Georgia,serif"}}>
                              {d===-1?"Bir":d===0?"Par":d===1?"Bog":"Dbl"}
                            </button>
                          ))}
                          <button onClick={()=>handleNR(hole)} style={{width:34,height:34,borderRadius:8,border:"1px solid "+(isNR?"#94a3b8":"#2d5a2d"),background:isNR?"#94a3b822":"#0d1a0d",color:isNR?"#94a3b8":WHITE,cursor:"pointer",fontSize:10,fontFamily:"Georgia,serif",fontWeight:isNR?"bold":"normal"}}>NR</button>

                              {opt==="Hit"?"GIR":opt==="L"?"Left":opt==="R"?"Right":opt==="S"?"Short":"Long"}
                            </button>
                          );
                        })}
                      </div>
                      <button onClick={()=>handleGrn(hole,"LU")} style={{width:"100%",padding:"7px 4px",borderRadius:8,border:"1px solid "+(holeGrn.includes("LU")?GRN_COLOR["LU"]:"#2d5a2d"),background:holeGrn.includes("LU")?GRN_COLOR["LU"]+"33":"#0d1a0d",color:holeGrn.includes("LU")?GRN_COLOR["LU"]:WHITE,cursor:"pointer",fontSize:11,fontFamily:"Georgia,serif",fontWeight:holeGrn.includes("LU")?"bold":"normal"}}>

                        </div>
                      )}
                      {holeGrn.includes("LU")&&(
                        <div style={{marginTop:6,fontSize:11,color:"#60a5fa",fontWeight:"bold"}}>Lay-up recorded — not counted vs GIR</div>
                      )}
                    </div>
                    <div>
                      <div style={{fontSize:10,letterSpacing:3,color:WHITE,textTransform:"uppercase",marginBottom:8}}>Putts</div>
                      <div style={{display:"flex",gap:8}}>
                        {[1,2,3,4].map(n=>(
                          <button key={n} onClick={()=>handlePutts(hole,n)} style={{flex:1,padding:"8px 4px",borderRadius:8,border:"1px solid "+(putts[hole]===n?GREEN:"#2d5a2d"),background:putts[hole]===n?"#4ade8022":"#0d1a0d",color:putts[hole]===n?GREEN:WHITE,cursor:"pointer",fontSize:14,fontFamily:"Georgia,serif",fontWeight:putts[hole]===n?"bold":"normal"}}>{n}</button>

                    </div>

                      <div style={{display:"flex",gap:8}}>
                        <button onClick={()=>setOb(p=>({...p,[hole]:p[hole]?undefined:true}))} style={{flex:1,padding:"8px 4px",borderRadius:8,border:"1px solid "+(ob[hole]?"#ef4444":"#2d5a2d"),background:ob[hole]?"#ef444433":"#0d1a0d",color:ob[hole]?"#ef4444":WHITE,cursor:"pointer",fontSize:12,fontFamily:"Georgia,serif",fontWeight:ob[hole]?"bold":"normal"}}>OOB</button>
                        <button onClick={()=>setHazard(p=>({...p,[hole]:p[hole]?undefined:true}))} style={{flex:1,padding:"8px 4px",borderRadius:8,border:"1px solid "+(hazard[hole]?"#f97316":"#2d5a2d"),background:hazard[hole]?"#f9731633":"#0d1a0d",color:hazard[hole]?"#f97316":WHITE,cursor:"pointer",fontSize:12,fontFamily:"Georgia,serif",fontWeight:hazard[hole]?"bold":"normal"}}>Hazard</button>
                        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
                          {ob[hole]&&<span style={{fontSize:10,color:"#ef4444",fontWeight:"bold"}}>⛔ OOB</span>}
                          {hazard[hole]&&<span style={{fontSize:10,color:"#f97316",fontWeight:"bold"}}>⚠️ Haz</span>}
                          {!ob[hole]&&!hazard[hole]&&<span style={{fontSize:10,color:"#5a8a5a"}}>none</span>}
                        </div>
                      </div>
                      <input
                        type="text"
                        value={notes[hole]||""}
                        onChange={e=>setNotes(p=>({...p,[hole]:e.target.value||undefined}))}
                        placeholder="Note (wrong club, mental error…)"
                        style={{...INP,width:"100%",marginTop:8,fontSize:12,padding:"9px 12px"}}
                      />
                    </div>
                    {holeGrn.length>0&&!holeGrn.includes("Hit")&&(
                      <div>
                        <div style={{fontSize:10,letterSpacing:3,color:WHITE,textTransform:"uppercase",marginBottom:4}}>Up and Down</div>
                        <div style={{fontSize:10,color:"#86efac",marginBottom:8}}>GIR missed - did you get up and down?</div>
                        <div style={{display:"flex",gap:8}}>
                          <button onClick={()=>setUpdown(p=>({...p,[hole]:"yes"}))} style={{flex:1,padding:"10px 4px",borderRadius:8,border:"1px solid "+(updown[hole]==="yes"?GREEN:"#2d5a2d"),background:updown[hole]==="yes"?"#4ade8033":"#0d1a0d",color:updown[hole]==="yes"?GREEN:WHITE,cursor:"pointer",fontSize:13,fontFamily:"Georgia,serif",fontWeight:updown[hole]==="yes"?"bold":"normal"}}>Yes</button>
                          <button onClick={()=>setUpdown(p=>({...p,[hole]:"no"}))} style={{flex:1,padding:"10px 4px",borderRadius:8,border:"1px solid "+(updown[hole]==="no"?"#ef4444":"#2d5a2d"),background:updown[hole]==="no"?"#ef444433":"#0d1a0d",color:updown[hole]==="no"?"#ef4444":WHITE,cursor:"pointer",fontSize:13,fontFamily:"Georgia,serif",fontWeight:updown[hole]==="no"?"bold":"normal"}}>No</button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
            {hcp>0&&stats.holesScored>0&&(
              <div style={{background:"#162816",border:"1px solid #2d5a2d",borderRadius:12,padding:"16px 20px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:11,letterSpacing:3,color:"#86efac",textTransform:"uppercase",marginBottom:4}}>Stableford Total</div>
                  <div style={{fontSize:12,color:WHITE}}>{stats.holesScored} holes played</div>
                </div>
                <div style={{fontSize:36,fontWeight:"bold",color:YELLOW}}>⭐ {stats.totalStableford}</div>
              </div>
            )}
            <button onClick={doSave} style={{...PBTN,marginTop:4}}>{editingRoundId?"Update Round":"Save Round to My Stats"}</button>
            {saveMsg&&<div style={{textAlign:"center",color:saveMsg.includes("Error")?"#ef4444":GREEN,fontSize:13,marginTop:12,letterSpacing:1}}>{saveMsg}</div>}
            <button onClick={clearRound} style={{width:"100%",padding:"12px",marginTop:8,background:"transparent",border:"1px solid #3a1a1a",borderRadius:10,color:"#ef4444",cursor:"pointer",fontSize:11,letterSpacing:3,textTransform:"uppercase",fontFamily:"Georgia,serif"}}>Reset Round</button>
          </div>
        )}

        {activeTab==="stats"&&(
          stats.holesPlayed===0
            ?<div style={{textAlign:"center",color:"#14532d",padding:40,fontSize:14,letterSpacing:2}}>No data yet - enter your round in the Scorecard tab</div>
            :<StatsPanel s={stats} notes={notes}/>
        )}

        {activeTab==="history"&&(
          <div>
            {viewRound!==null?(
              <div>
                <button onClick={()=>setViewRound(null)} style={{background:"transparent",border:"1px solid #2d5a2d",borderRadius:8,color:WHITE,cursor:"pointer",padding:"8px 16px",fontSize:11,letterSpacing:2,textTransform:"uppercase",fontFamily:"Georgia,serif",marginBottom:16}}>Back</button>
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:18,fontWeight:"bold",color:"#14532d"}}>{savedRounds[viewRound].course}</div>
                  <div style={{fontSize:12,color:"#166534",marginTop:4}}>{savedRounds[viewRound].date}</div>
                </div>
                <StatsPanel s={savedRounds[viewRound].stats} notes={savedRounds[viewRound].data?.notes}/>
                <button onClick={()=>doEditRound(savedRounds[viewRound])} style={{width:"100%",marginTop:16,padding:"12px",background:"#1a2f4a",border:"1px solid #3b6ea8",borderRadius:10,color:"#93c5fd",cursor:"pointer",fontSize:11,letterSpacing:3,textTransform:"uppercase",fontFamily:"Georgia,serif"}}>Edit This Round</button>
                {confirmDelete===savedRounds[viewRound].id?(
                  <div style={{marginTop:16,textAlign:"center"}}>
                    <div style={{color:"#ef4444",fontSize:13,marginBottom:12}}>Delete this round?</div>
                    <div style={{display:"flex",gap:12,justifyContent:"center"}}>
                      <button onClick={()=>doDelete(savedRounds[viewRound].id)} style={{padding:"10px 24px",background:"#ef444422",border:"1px solid #ef4444",borderRadius:8,color:"#ef4444",cursor:"pointer",fontFamily:"Georgia,serif",fontSize:12}}>Yes, delete</button>
                      <button onClick={()=>setConfirmDelete(null)} style={{padding:"10px 24px",background:"transparent",border:"1px solid #2d5a2d",borderRadius:8,color:WHITE,cursor:"pointer",fontFamily:"Georgia,serif",fontSize:12}}>Cancel</button>
                    </div>
                  </div>
                ):(
                  <button onClick={()=>setConfirmDelete(savedRounds[viewRound].id)} style={{width:"100%",marginTop:8,padding:"12px",background:"transparent",border:"1px solid #3a1a1a",borderRadius:10,color:"#ef4444",cursor:"pointer",fontSize:11,letterSpacing:3,textTransform:"uppercase",fontFamily:"Georgia,serif"}}>Delete This Round</button>
                )}
              </div>
            ):loadingRounds?(
              <div style={{textAlign:"center",color:"#14532d",padding:40,fontSize:13,letterSpacing:3}}>Loading rounds...</div>
            ):savedRounds.length===0?(
              <div style={{textAlign:"center",color:"#14532d",padding:40,fontSize:14,letterSpacing:2}}>No rounds saved yet.</div>
            ):(
              <div>
                {aggregate&&<div style={{marginBottom:24}}><div style={{fontSize:11,letterSpacing:4,color:"#14532d",textTransform:"uppercase",marginBottom:16}}>Season Overview</div><StatsPanel s={aggregate}/></div>}
                <div style={{fontSize:11,letterSpacing:4,color:"#14532d",textTransform:"uppercase",marginBottom:16}}>Round History</div>
                {savedRounds.map((r,i)=>{
                  const rsd=sdDisplay(r.stats.scoreDiff);
                  return (
                    <div key={r.id} style={{background:CARD,border:"1px solid #2d5a2d",borderRadius:12,marginBottom:10,overflow:"hidden"}}>
                      <button onClick={()=>setViewRound(i)} style={{width:"100%",textAlign:"left",background:"transparent",border:"none",padding:"14px 16px",cursor:"pointer",fontFamily:"Georgia,serif",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div>
                          <div style={{fontSize:15,fontWeight:"bold",color:WHITE}}>{r.course}</div>
                          <div style={{fontSize:11,color:WHITE,marginTop:4}}>{r.date}</div>
                          <div style={{fontSize:11,color:WHITE,marginTop:4}}><span style={{color:YELLOW,fontWeight:"bold"}}>{r.stats.holesScored||18} holes</span> · FWY {pct(r.stats.fwyHit,r.stats.fwyTotal)} - GIR {pct(r.stats.grnHit,r.stats.grnTotal)} - {r.stats.totalPutts} putts{r.stats.threePuttHoles>0?" (3+ putts on "+r.stats.threePuttHoles+" hole"+(r.stats.threePuttHoles!==1?"s":"")+")":" "}{r.stats.totalStableford?" - ⭐"+r.stats.totalStableford+"pts":""}</div>
                        </div>
                        <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
                          <div style={{fontSize:22,fontWeight:"bold",color:rsd.color}}>{rsd.text}</div>
                          <div style={{fontSize:13,color:WHITE,marginTop:2}}>{r.stats.totalScore||"—"}</div>
                          <div style={{fontSize:11,color:WHITE}}>›</div>
                        </div>
                      </button>
                      <div style={{borderTop:"1px solid #2d5a2d",padding:"10px 16px",display:"flex",justifyContent:"flex-end"}}>
                        <button onClick={()=>shareRound(r)} style={{background:"#4ade8022",border:"1px solid #4ade8044",borderRadius:8,color:GREEN,cursor:"pointer",padding:"8px 16px",fontSize:11,fontFamily:"Georgia,serif",letterSpacing:2,textTransform:"uppercase"}}>Share Round</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
